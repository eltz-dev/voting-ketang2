<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin · Voting Ketang “2” 43</title><link rel="stylesheet" href="style.css">
<style>
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate .card{padding:30px;max-width:380px;width:100%;animation:pop .4s}
.gate h2{margin-bottom:6px}.gate p{color:var(--mute);margin-bottom:16px}
input{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:12px}
input:focus{outline:3px solid var(--sun)}
.err{color:var(--tomato);font-weight:700;font-size:.9rem;min-height:1.3em;margin-bottom:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.panel{padding:22px;margin-top:24px}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.stats{display:flex;gap:30px;margin:6px 0 0}
.stats b{font:900 2.6rem Fraunces,serif;display:block}
.row{margin-top:20px}.row .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.row .nm{font-weight:700}.row .nm small{color:var(--mute);font-weight:500;margin-left:6px}
.row .ct{font:900 1.5rem Fraunces,serif}.row .ct small{font:500 .8rem 'DM Sans';color:var(--mute);margin-left:4px}
.track{height:20px;border:2px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.fill{height:100%;width:0;background:var(--green);transition:width .6s cubic-bezier(.2,1,.3,1)}
.row.lead .fill{background:var(--tomato)}
.crown{display:none}.row.lead.has .crown{display:inline}
[hidden]{display:none!important}
</style></head><body>
<div class="gate" id="gate"><div class="card"><h2>Panel Admin</h2><p>Masukkan kunci untuk melanjutkan.</p>
<input type="password" id="key" placeholder="Kunci admin" autocomplete="off"><div class="err" id="err"></div>
<button class="btn" id="enter" style="width:100%">Masuk</button></div></div>

<div class="wrap" id="dash" hidden>
<div class="top"><div><p class="eyebrow">Panel Admin</p><h1 class="title" style="font-size:clamp(1.9rem,6vw,2.8rem)">Voting Ketang <em>“2”</em> 43</h1></div>
<button class="btn alt" id="out" style="padding:8px 18px">Keluar</button></div>
<section class="card panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
<h3>Kontrol Voting</h3><span class="pill off" id="st"><i></i><span>Memuat…</span></span></div>
<div class="ctl"><button class="btn green" id="on">Nyalakan Voting</button><button class="btn" id="off">Matikan Voting</button></div></section>
<section class="card panel"><h3>Perolehan Suara <span style="font:500 .8rem 'DM Sans';color:var(--mute)">· langsung, tanpa refresh</span></h3>
<div class="stats"><div><b id="tot">0</b>total suara</div></div><div id="rows"></div></section></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
const $=id=>document.getElementById(id);
const ADMIN_KEY="vonevershine43";
function login(){
  if($("key").value.trim()===ADMIN_KEY){try{sessionStorage.setItem("adm43","1")}catch(e){}start()}
  else{$("err").textContent="Kunci salah, coba lagi.";$("key").select()}
}
$("enter").onclick=login;$("key").onkeydown=e=>{if(e.key==="Enter")login()};
$("out").onclick=()=>{try{sessionStorage.removeItem("adm43")}catch(e){}location.reload()};
let started=false;
function start(){
  if(started)return;started=true;$("gate").hidden=true;$("dash").hidden=false;
  $("rows").innerHTML=CANDIDATES.map(c=>`<div class="row" id="r-${c.id}"><div class="head"><span class="nm"><span class="crown">👑 </span>${c.no}. ${c.name}<small>${c.kelas}</small></span>
  <span class="ct"><span class="n">0</span><small class="p">0%</small></span></div><div class="track"><div class="fill"></div></div></div>`).join("");
  db.ref("settings/votingOpen").on("value",s=>{
    const o=s.val()===true;$("st").className="pill "+(o?"on":"off");$("st").lastChild.textContent=o?"Voting sedang dibuka":"Voting dimatikan";
    $("on").disabled=o;$("off").disabled=!o});
  db.ref("votes").on("value",s=>{
    const v=s.val()||{};const tot=CANDIDATES.reduce((a,c)=>a+(v[c.id]||0),0);const max=Math.max(...CANDIDATES.map(c=>v[c.id]||0));
    $("tot").textContent=tot;
    CANDIDATES.forEach(c=>{const n=v[c.id]||0,r=$("r-"+c.id),pc=tot?Math.round(n/tot*100):0;
      r.querySelector(".n").textContent=n;r.querySelector(".p").textContent=pc+"%";r.querySelector(".fill").style.width=pc+"%";
      r.classList.toggle("lead",n===max);r.classList.toggle("has",n>0&&n===max)})});
}
$("on").onclick=()=>db.ref("settings/votingOpen").set(true);
$("off").onclick=()=>db.ref("settings/votingOpen").set(false);
try{if(sessionStorage.getItem("adm43")==="1")start()}catch(e){}
</script></body></html>
